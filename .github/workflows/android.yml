name: Android build

on:
  push:
    paths:
      - 'platforms/android/**'
      - 'shared/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'platforms/android/**'
      - 'shared/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the same commit as .github/workflows/checks.yml so the two
      # workflows cannot diverge on action versions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.3.13750724
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: platforms/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        working-directory: platforms/android
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK (compiles shared/ C++ via NDK + CMake)
        working-directory: platforms/android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            platforms/android/app/build/reports/**
            platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
