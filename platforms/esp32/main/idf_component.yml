dependencies:
  waveshare/esp32_s3_touch_amoled_1_75c:
    version: "3.0.0"
  # Official board example uses this component for the onboard QMI8658.
  # We use its gyroscope only as a fast, short-term yaw increment; the phone's
  # motion course remains the long-term heading reference.
  waveshare/qmi8658:
    version: "^2.0.0"
  # The official Waveshare 1.75C LVGL-9 example pins 9.5.0. Point the
  # Component Manager at the repository submodule so Web and firmware compile
  # the exact same checkout rather than resolving two independent copies.
  lvgl/lvgl:
    version: "9.5.0"
    public: true
    override_path: "../../../third_party/lvgl"
  # Required by the ESP32-S3-Touch-LCD-1.85B board port. Both are Espressif
  # components, so they also serve as the reference for the panel and touch
  # hardware that board uses.
  #
  # The ST77916 driver must match the version Waveshare's own 1.85B BSP asks
  # for (^2.0.1). We sat on 0.0.2 at first and the panel came up striped: that
  # driver ships the generic ST77916 register table, and the 1.85B is not a
  # generic ST77916 - the board needs one of the two vendor tables the BSP
  # selects between by reading panel register 0x04.
  espressif/esp_lcd_st77916:
    version: "^2.0.1"
  espressif/esp_lcd_touch_cst816s:
    version: "^1.0.2"
  espressif/esp_lcd_touch:
    version: "^1"
  espressif/esp_lvgl_adapter:
    version: "~0.6"
