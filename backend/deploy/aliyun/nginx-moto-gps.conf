# MOTO GPS 网关的反向代理（阿里云 ECS / 任意 Linux 主机通用）
#
# 手机访问 https://<你的域名>/moto-gps/api/... ，这里转发到只监听回环地址的网关。
# proxy_pass 末尾那个 "/" 就是去掉前缀的关键：
#   /moto-gps/api/v1/routes  ->  /v1/routes
# 少了它，后端会收到 /moto-gps/api/v1/routes 而返回 404。
#
# 放到 /etc/nginx/conf.d/moto-gps.conf（或 sites-available 里再软链），
# 然后 certbot --nginx -d <你的域名> 会自动补上 443 与证书。

server {
    listen 80;
    listen [::]:80;

    server_name www.bloodbear.xin;
    # 想让 apex 域名也指向网关时，取消下面一行的注释，并用
    # certbot --nginx -d www.bloodbear.xin -d bloodbear.xin 一起签证书。
    # server_name bloodbear.xin;

    # 网关自己的响应只有几 KB；真正大的只有地图瓦片。
    client_max_body_size 64k;

    location /moto-gps/api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 网关只信任来自回环地址的 X-Real-IP，这里正是那一跳。
        # 必须覆盖而不是透传，否则客户端可以自己伪造这个头绕过限流。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # 这个域名只服务网关，其它路径一律 404。
    location / {
        return 404;
    }
}
